# Test-only classpath: never packaged into the production jar.
spring:
  datasource:
    url: jdbc:h2:mem:unilend-test;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    username: sa
    password: ""
    driver-class-name: org.h2.Driver
  flyway:
    enabled: true
    locations: classpath:db/migration/h2
    baseline-on-migrate: false
    clean-disabled: true
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: false

app:
  jwt:
    # Public dummy key exclusively for isolated tests.
    secret: dW5pbGVuZC10ZXN0LWp3dC1zZWNyZXQta2V5LWF0LWxlYXN0LTMyLWJ5dGVz
    issuer: http://unilend.test
  mail:
    enabled: false
  upload:
    dir: target/test-uploads

logging:
  level:
    org.hibernate.SQL: WARN
    org.hibernate.orm.jdbc.bind: "OFF"
