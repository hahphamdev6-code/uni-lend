spring:
  config:
    import: optional:file:.env[.properties]

  servlet:
    multipart:
      # 5 images x 5MB plus multipart headers; enforced by the servlet parser.
      max-file-size: 5MB
      max-request-size: 26MB

  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/uni_lend}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  # UniLend Flyway V1
  flyway:
    enabled: true
    locations: "classpath:db/migration/{vendor}"
    baseline-on-migrate: false
    baseline-version: "1"
    clean-disabled: true
    validate-on-migrate: true
    validate-migration-naming: true
    fail-on-missing-locations: true

  sql:
    init:
      mode: never

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        default_batch_fetch_size: 16

  mail:
    host: ${SMTP_HOST:localhost}
    port: ${SMTP_PORT:1025}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${SMTP_AUTH:false}
          starttls:
            enable: ${SMTP_STARTTLS:false}

# springdoc phải nằm ở cấp cao nhất, không nằm trong "spring:"
springdoc:
  api-docs:
    enabled: ${SWAGGER_ENABLED:true}
  swagger-ui:
    enabled: ${SWAGGER_ENABLED:true}

app:
  jwt:
    # Base64, tối thiểu 32 byte. Tạo bằng: openssl rand -base64 32
    secret: ${JWT_SECRET}
    issuer: ${JWT_ISSUER:http://unilend.local}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
  upload:
    dir: ${UPLOAD_DIR:uploads}
  frontend:
    url: ${FRONTEND_URL:http://localhost:3000}
  mail:
    enabled: ${MAIL_ENABLED:false}
    from: ${MAIL_FROM:no-reply@unilend.local}
  security:
    verify-email-ttl-minutes: ${VERIFY_EMAIL_TTL_MINUTES:1440}
    reset-password-ttl-minutes: ${RESET_PASSWORD_TTL_MINUTES:15}
  rate-limit:
    login-max-attempts: ${RATE_LIMIT_LOGIN_MAX:5}
    login-window-seconds: ${RATE_LIMIT_LOGIN_WINDOW_SECONDS:60}
    email-max-attempts: ${RATE_LIMIT_EMAIL_MAX:3}
    email-window-seconds: ${RATE_LIMIT_EMAIL_WINDOW_SECONDS:900}
  swagger:
    enabled: ${SWAGGER_ENABLED:true}

server:
  port: 8080