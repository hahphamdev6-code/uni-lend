
spring:
  config:
    import: optional:file:.env[.properties]
  servlet:
    multipart:
      # 5 images x 5MB plus multipart headers; enforced by the servlet parser.
      max-file-size: 5MB
      max-request-size: 26MB
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/uni_lend}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  # UniLend Flyway V1
  flyway:
    enabled: true
    locations: "classpath:db/migration/{vendor}"
    baseline-on-migrate: false
    baseline-version: "1"
    clean-disabled: true
    validate-on-migrate: true
    validate-migration-naming: true
    fail-on-missing-locations: true
  sql:
    init:
      mode: never

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        default_batch_fetch_size: 16


app:
  jwt:
    # Base64, tối thiểu 32 byte. Tạo bằng: openssl rand -base64 32
    secret: ${JWT_SECRET}
    issuer: ${JWT_ISSUER:http://unilend.local}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
  upload:
    dir: ${UPLOAD_DIR:uploads}

server:
  port: 8080
