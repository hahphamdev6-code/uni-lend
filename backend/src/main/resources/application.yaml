spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

server:
  port: 8080

security:
  jwt:
    issuer-uri: ${JWT_ISSUER_URI:}
    jwk-set-uri: ${JWT_JWK_SET_URI:}
    audience: ${JWT_AUDIENCE:}
